<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- CSP: Only allow local file:// resources and inline scripts/styles. No remote access. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' file:; media-src 'self' file:;">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
body { display: flex; flex-direction: column; }

/*
 * Header bar: 28px draggable region for window movement.
 * -webkit-app-region: drag makes the entire header a native drag handle.
 * Content below the header remains clickable for popup interaction.
 */
#header {
  height: 28px;
  min-height: 28px;
  background: rgba(20, 20, 35, 0.85);
  -webkit-app-region: drag;
  display: flex;
  align-items: center;
  padding: 0 8px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 11px;
  color: rgba(255, 255, 255, 0.7);
  user-select: none;
  cursor: grab;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
#header:active { cursor: grabbing; }
#header-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  pointer-events: none;
}

/* Media container: holds the main image/video + hypno overlay + click counter */
#media-container {
  flex: 1;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* Main media element (image or video replaced via JS) */
#media { width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }

/* Hypno overlay for video files (autoplay, muted, looped) */
#hypno { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; object-fit: cover; }

/* Hypno overlay for static image files (gif subliminal) */
#hypno-img { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; object-fit: cover; }

/* Click counter badge (shown when clicksToClose > 1) */
#counter { position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.6); color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-family: sans-serif; display: none; }

/* Click-through mode: disable all pointer events on the entire window */
body.clickthrough #header { pointer-events: none; }
body.clickthrough { pointer-events: none; }
</style>
</head>
<body>
<div id="header"><span id="header-title"></span></div>
<div id="media-container">
  <img id="media" alt="">
  <!-- FUTUREWORK: Add <source> elements for better format detection instead of
       relying on the browser's codec support. Currently mp4/webm/mov are the
       only supported video formats (matched in VIDEO_EXTS in pack.ts). -->
  <video id="hypno" autoplay loop muted playsinline style="display:none"></video>
  <img id="hypno-img" alt="" style="display:none">
  <div id="counter">0/0</div>
</div>
<script>
/*
 * Popup window initialization script.
 *
 * Parameters are passed via URL query string from the main process:
 *   - mediaPath: absolute path to the media file
 *   - type: 'image' or 'video'
 *   - opacity: 0–100 (mapped to 0.0–1.0)
 *   - denialFilter: CSS filter string (e.g., "blur(3px) saturate(0%)")
 *   - hypnoMediaPath: absolute path to hypno overlay file (optional)
 *   - hypnoOpacity: 0–100 (mapped to 0.0–1.0)
 *   - clicksToClose: number of clicks needed to dismiss (1 = instant)
 *   - clickthrough: 'true' to make window click-through
 *
 * REMOVABLE: The video error fallback div is only needed because Electron's
 * Chromium may not support all codecs. If VIDEO_EXTS is restricted to
 * universally supported formats, this fallback could be simplified.
 */
(function(){
  const p = new URLSearchParams(location.search);
  const mediaPath = p.get('mediaPath') || '';
  const type = p.get('type') || 'image';
  const opacity = Math.min(100, Math.max(0, parseFloat(p.get('opacity') || '100'))) / 100;
  const denialFilter = p.get('denialFilter') || '';
  const hypnoMediaPath = p.get('hypnoMediaPath') || '';
  const hypnoOpacity = Math.min(100, Math.max(0, parseFloat(p.get('hypnoOpacity') || '20'))) / 100;
  const clicksToClose = Math.max(1, parseInt(p.get('clicksToClose') || '1', 10));
  const clickthrough = p.get('clickthrough') === 'true';

  if (clickthrough) document.body.classList.add('clickthrough');

  // Display the filename in the header bar
  var fileName = mediaPath.split(/[\\/]/).pop() || 'Popup';
  document.getElementById('header-title').textContent = fileName;

  const media = document.getElementById('media');
  if (type === 'video') {
    // Replace <img> with <video> element for video playback
    const vid = document.createElement('video');
    vid.id = 'media';
    vid.src = 'file://' + encodeURI(mediaPath);
    vid.autoplay = true;
    vid.loop = true;
    vid.muted = false;
    vid.playsInline = true;
    vid.style.cssText = media.style.cssText;
    vid.addEventListener('error', function() {
      var fb = document.createElement('div');
      fb.style.cssText = 'width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.3);font-size:12px;font-family:sans-serif;';
      fb.textContent = 'unsupported format';
      vid.replaceWith(fb);
    });
    media.replaceWith(vid);
  } else {
    media.src = 'file://' + encodeURI(mediaPath);
    media.draggable = false;
  }

  // Apply opacity and denial filter to the main media element
  const m = document.getElementById('media');
  m.style.opacity = opacity;
  if (denialFilter) m.style.filter = denialFilter;

  // Hypno overlay: only shown if hypnoMediaPath is provided
  // Currently only .gif files reach this point (HYPN_EXTS = {'.gif'} in pack.ts)
  // The isVid check is kept as a safety net in case the main process sends
  // a video file, but in practice hypnoMediaPath will always be a .gif.
  if (hypnoMediaPath) {
    const isVid = /\.(mp4|webm|ogg|mov)$/i.test(hypnoMediaPath);
    const el = isVid ? document.getElementById('hypno') : document.getElementById('hypno-img');
    el.src = 'file://' + encodeURI(hypnoMediaPath);
    el.style.display = 'block';
    el.style.opacity = hypnoOpacity;
    if (isVid) {
      el.addEventListener('error', function() { this.style.display = 'none'; });
    }
  }

  // Click-to-close handler with optional multi-click counter
  document.body.addEventListener('click', function onClick() {
    if (clickthrough) return;
    if (clicksToClose <= 1) { window.close(); return; }
    const ctr = document.getElementById('counter');
    let cc = parseInt(ctr.textContent.split('/')[0] || '0', 10);
    cc++;
    ctr.textContent = cc + '/' + clicksToClose;
    ctr.style.display = 'block';
    if (cc >= clicksToClose) window.close();
  });
})();
</script>
</body>
</html>
