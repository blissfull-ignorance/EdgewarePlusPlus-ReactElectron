name: CI

on:
  push:
    branches: [webapp]
  pull_request:

jobs:
  gates:
    name: Gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run test

  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E (browser + Electron layers, Linux under Xvfb)
        if: runner.os == 'Linux'
        uses: coactions/setup-xvfb@v1
        with:
          run: npm run test:e2e
        env:
          CI: "true"
      - name: E2E (browser + Electron layers)
        if: runner.os != 'Linux'
        run: npm run test:e2e
        env:
          CI: "true"
